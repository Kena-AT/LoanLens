name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Run flake8
      run: flake8 src/ app.py --max-line-length=120 --extend-ignore=E203,W503
    
    - name: Run black check
      run: black src/ app.py --check --line-length=120
    
    - name: Run isort check
      run: isort src/ app.py --check-only --profile black

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t loanlens:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8501:8501 --name test-container loanlens:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8501/_stcore/health || exit 1
        docker stop test-container
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.ref == 'refs/heads/main'
    
    - name: Push to Docker Hub
      run: |
        docker tag loanlens:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/loanlens:latest
        docker tag loanlens:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/loanlens:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/loanlens:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/loanlens:${{ github.sha }}
      if: github.ref == 'refs/heads/main'
